{{- if .Values.validatingWebhook.enabled }}
{{- $webhookName := include "kubeovn.webhookName" . -}}
{{- $webhookCertificateName := include "kubeovn.resourceName" (dict "context" . "suffix" "webhook-serving-cert") -}}
{{- $webhookIssuerName := include "kubeovn.resourceName" (dict "context" . "suffix" "webhook-selfsigned-issuer") -}}
{{- $webhookSecretName := include "kubeovn.resourceName" (dict "context" . "suffix" "webhook-secret") -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $webhookCertificateName }}
  namespace: {{ .Values.namespace }}
  {{- with .Values.validatingWebhook.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.validatingWebhook.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  dnsNames:
    - {{ $webhookName }}.{{ .Values.namespace }}
    - {{ $webhookName }}.{{ .Values.namespace }}.svc
    - {{ $webhookName }}.{{ .Values.namespace }}.svc.{{ .Values.clusterDomain }}
  issuerRef:
    kind: Issuer
    name: {{ $webhookIssuerName }}
    group: cert-manager.io
  secretName: {{ $webhookSecretName }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $webhookIssuerName }}
  namespace: {{ .Values.namespace }}
  {{- with .Values.validatingWebhook.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.validatingWebhook.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selfSigned: {}
{{- end }}
