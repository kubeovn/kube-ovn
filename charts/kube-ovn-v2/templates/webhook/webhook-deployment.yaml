{{- if .Values.validatingWebhook.enabled }}
{{- $webhookImage := include "kubeovn.imageSpec" (dict "root" . "image" .Values.validatingWebhook.image) | fromYaml -}}
{{- $webhookName := include "kubeovn.webhookName" . -}}
{{- $ovnServiceAccountName := include "kubeovn.ovnServiceAccountName" . -}}
{{- $webhookSecretName := include "kubeovn.resourceName" (dict "context" . "suffix" "webhook-secret") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $webhookName }}
  namespace: {{ .Values.namespace }}
  {{- with .Values.validatingWebhook.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.validatingWebhook.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $webhookName }}
      app.kubernetes.io/part-of: kube-ovn
  template:
    metadata:
      {{- with .Values.validatingWebhook.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ $webhookName }}
        app.kubernetes.io/part-of: kube-ovn
        {{- with .Values.validatingWebhook.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      tolerations:
        - operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ $webhookName }}
                  app.kubernetes.io/part-of: kube-ovn
              topologyKey: kubernetes.io/hostname
      priorityClassName: system-cluster-critical
      serviceAccountName: {{ $ovnServiceAccountName }}
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-ovn-webhook
          image: {{ $webhookImage.prefix }}{{ $webhookImage.repository }}:{{ $webhookImage.tag }}
          imagePullPolicy: {{ $webhookImage.pullPolicy }}
          command:
            - /kube-ovn/kube-ovn-webhook
          args:
            - --port=8443
            - --health-probe-port=8080
            - --v=3
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.podIP
            {{- with .Values.validatingWebhook.extraEnv }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: cert
              readOnly: true
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
            - containerPort: 8080
              name: health-probe
              protocol: TCP
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
      volumes:
        - name: cert
          secret:
            defaultMode: 420
            secretName: {{ $webhookSecretName }}
      nodeSelector:
        kubernetes.io/os: "linux"
{{- end }}
