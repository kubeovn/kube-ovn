{{- $natConfigName := include "kubeovn.resourceName" (dict "context" . "suffix" "vpc-nat-config") -}}
{{- $natGwConfigName := include "kubeovn.resourceName" (dict "context" . "suffix" "vpc-nat-gw-config") -}}
kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ $natConfigName }}
  namespace: {{ .Values.namespace }}
data:
  image: {{ .Values.natGw.image.repository }}:{{ .Values.natGw.image.tag }}
  {{- with .Values.natGw.bgpSpeaker.image }}
  bgpSpeakerImage: {{ .repository }}:{{ .tag }}
  {{- end }}
  {{- with .Values.natGw.bgpSpeaker.apiNadProvider }}
  apiNadProvider: {{ tpl . $ }}
  {{- end }}
  {{- with .Values.natGw.namePrefix }}
  natGwNamePrefix: {{ . | quote }}
  {{- end }}

---
kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ $natGwConfigName }}
  namespace: {{ .Values.namespace }}
data:
  enable-vpc-nat-gw: "{{ .Values.features.enableNatGateways }}"
