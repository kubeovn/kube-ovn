{{- /* kube-ovn-monitor cannot collect from pod-mode ovn-central (unix ctl sockets and
     hostPaths it mounts are empty there), so its resources are not rendered in pod mode. */ -}}
{{- if and (include "kubeovn.renderControlPlane" .) (not .Values.central.hcp.enabled) }}
kind: Service
apiVersion: v1
metadata:
  name: kube-ovn-monitor{{ include "kubeovn.centralSuffix" . }}
  namespace: {{ include "kubeovn.centralNamespace" . }}
  {{- with .Values.monitor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: kube-ovn-monitor{{ include "kubeovn.centralSuffix" . }}
    app.kubernetes.io/part-of: kube-ovn
    {{- with .Values.monitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ports:
    - name: metrics
      port: {{ .Values.monitor.metrics.port }}
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kube-ovn-monitor{{ include "kubeovn.centralSuffix" . }}
    app.kubernetes.io/part-of: kube-ovn
  sessionAffinity: None
  {{- if eq .Values.networking.stack "Dual" }}
  ipFamilyPolicy: PreferDualStack
  {{- end }}
{{- end }}
