{{- if .Values.features.enableHardwareVtep }}
{{- if not .Values.networking.vtepDbAddr }}
{{- fail "networking.vtepDbAddr is required when features.enableHardwareVtep is true (ovn-controller-vtep cannot start without a Hardware VTEP OVSDB remote)" }}
{{- end }}
{{- $vtepImage := include "kubeovn.imageSpec" (dict "root" . "image" .Values.hardwareVtep.image) | fromYaml -}}
kind: Deployment
apiVersion: apps/v1
metadata:
  name: ovn-controller-vtep
  namespace: {{ .Values.namespace }}
  annotations:
    kubernetes.io/description: |
      OVN Hardware VTEP controller (ovn-controller-vtep)
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app: ovn-controller-vtep
  template:
    metadata:
      labels:
        app: ovn-controller-vtep
        component: network
        type: infra
    spec:
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
        - key: CriticalAddonsOnly
          operator: Exists
      affinity:
        {{- include "kube-ovn.affinities.nodeAffinity" (dict "hardcodedRequired" (include "kubeovn.masterNodeRequired" . | fromYamlArray) "userPreferred" .Values.hardwareVtep.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution "userRequired" .Values.hardwareVtep.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution) | nindent 8 }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: ovn-controller-vtep
              topologyKey: kubernetes.io/hostname
      priorityClassName: system-cluster-critical
      serviceAccountName: ovn
      automountServiceAccountToken: true
      hostNetwork: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: hostpath-init
          image: {{ $vtepImage.prefix }}{{ $vtepImage.repository }}:{{ $vtepImage.tag }}
          imagePullPolicy: {{ $vtepImage.pullPolicy }}
          command:
            - sh
            - -c
            - "chown -R nobody: /var/run/ovn /var/log/ovn /var/log/kube-ovn"
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              drop:
                - ALL
            privileged: true
            runAsUser: 0
          volumeMounts:
            - mountPath: /var/run/ovn
              name: host-run-ovn
            - mountPath: /var/log/ovn
              name: host-log-ovn
            - name: kube-ovn-log
              mountPath: /var/log/kube-ovn
      containers:
        - name: ovn-controller-vtep
          image: {{ $vtepImage.prefix }}{{ $vtepImage.repository }}:{{ $vtepImage.tag }}
          imagePullPolicy: {{ $vtepImage.pullPolicy }}
          command: ["/kube-ovn/start-ovn-controller-vtep.sh"]
          securityContext:
            runAsUser: {{ include "kubeovn.runAsUser" . }}
            privileged: false
            capabilities:
              add:
                - NET_BIND_SERVICE
                - SYS_NICE
          env:
            - name: ENABLE_SSL
              value: "{{ .Values.networking.enableSsl }}"
            - name: VTEP_DB_ADDR
              value: "{{ .Values.networking.vtepDbAddr }}"
            {{- if .Values.central.hcp.enabled }}
            - name: OVN_SB_ADDR
              value: "{{ include "kubeovn.ovnSbAddress" . }}"
            {{- else }}
            - name: OVN_DB_IPS
              value: "{{ include "kubeovn.masterNodes" . | default (include "kubeovn.nodeIPs" .) }}"
            {{- end }}
            {{- with .Values.hardwareVtep.extraEnv }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            requests:
              cpu: 200m
              memory: 200Mi
            limits:
              cpu: 1
              memory: 1Gi
              ephemeral-storage: 500Mi
          volumeMounts:
            - mountPath: /var/run/ovn
              name: host-run-ovn
            - mountPath: /var/log/ovn
              name: host-log-ovn
            - mountPath: /etc/localtime
              name: localtime
            - mountPath: /var/run/tls
              name: kube-ovn-tls
            - mountPath: /var/log/kube-ovn
              name: kube-ovn-log
      nodeSelector:
        kubernetes.io/os: "linux"
      volumes:
        - name: host-run-ovn
          hostPath:
            path: /run/ovn
        - name: host-log-ovn
          hostPath:
            path: /var/log/ovn
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: kube-ovn-log
          hostPath:
            path: /var/log/kube-ovn
        - name: kube-ovn-tls
          secret:
            optional: true
            secretName: kube-ovn-tls
{{- end }}
