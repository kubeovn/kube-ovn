{{- if .Values.frr.enabled }}
{{- $frrAgentImage := include "kubeovn.imageSpec" (dict "root" . "image" .Values.frr.image) | fromYaml -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-ovn-frr
  namespace: {{ .Values.namespace }}
  {{- with .Values.frr.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:kube-ovn-frr
  {{- with .Values.frr.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups:
      - kubeovn.io
    resources:
      - bgp-confs
      - vpcs
      - ovn-eips
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-ovn-frr
  {{- with .Values.frr.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kube-ovn-frr
subjects:
  - kind: ServiceAccount
    name: kube-ovn-frr
    namespace: {{ .Values.namespace }}
---
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: kube-ovn-frr
  namespace: {{ .Values.namespace }}
  {{- with .Values.frr.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-ovn-frr
      app.kubernetes.io/part-of: kube-ovn
  template:
    metadata:
      {{- with .Values.frr.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: kube-ovn-frr
        app.kubernetes.io/part-of: kube-ovn
    spec:
      tolerations:
        - operator: Exists
          effect: NoSchedule
      priorityClassName: system-node-critical
      serviceAccountName: kube-ovn-frr
      automountServiceAccountToken: false
      hostNetwork: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/os: "linux"
        ovn.kubernetes.io/external-gw: "true"
        {{- with .Values.frr.nodeSelector }}
        {{- toYaml . | trim | nindent 8 }}
        {{- end }}
      initContainers:
        - name: init-frr
          image: {{ $frrAgentImage.prefix }}{{ $frrAgentImage.repository }}:{{ $frrAgentImage.tag }}
          imagePullPolicy: {{ $frrAgentImage.pullPolicy }}
          command:
            - /kube-ovn/kube-ovn-frr
            - init
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: frr-config
              mountPath: /etc/frr
      containers:
        - name: frr
          image: {{ .Values.frr.frrImage.repository }}:{{ .Values.frr.frrImage.tag }}
          imagePullPolicy: {{ .Values.frr.frrImage.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - /usr/lib/frr/docker-start & exec sh /etc/frr/kube-ovn-reload.sh
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - NET_BIND_SERVICE
                - SYS_ADMIN
          volumeMounts:
            - name: frr-config
              mountPath: /etc/frr
        - name: kube-ovn-frr
          image: {{ $frrAgentImage.prefix }}{{ $frrAgentImage.repository }}:{{ $frrAgentImage.tag }}
          imagePullPolicy: {{ $frrAgentImage.pullPolicy }}
          command:
            - /kube-ovn/kube-ovn-frr
          args:
            - --logtostderr=false
            - --alsologtostderr=true
            - --log_file=/var/log/kube-ovn/kube-ovn-frr.log
            - --log_file_max_size=200
          {{- with .Values.frr.args }}
            {{- toYaml . | trim | nindent 12 }}
          {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: frr-config
              mountPath: /etc/frr
            - name: kube-ovn-log
              mountPath: /var/log/kube-ovn
            - name: serviceaccount
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          {{- with .Values.frr.resources }}
          resources:
            {{- toYaml . | trim | nindent 12 }}
          {{- end }}
      volumes:
        - name: frr-config
          emptyDir: {}
        - name: kube-ovn-log
          hostPath:
            path: {{ .Values.logging.directory }}/kube-ovn
            type: DirectoryOrCreate
        - name: serviceaccount
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
{{- end }}
