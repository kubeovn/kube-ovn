{{- if include "kubeovn.renderControlPlane" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubeovn.centralName" . }}
  namespace: {{ include "kubeovn.centralNamespace" . }}
automountServiceAccountToken: false
{{-  if .Values.global.registry.imagePullSecrets }}
imagePullSecrets:
{{- range $index, $secret := .Values.global.registry.imagePullSecrets }}
{{- if $secret }}
  - name: {{ $secret | quote}}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubeovn.centralName" . }}
  namespace: {{ include "kubeovn.centralNamespace" . }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - patch
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubeovn.centralName" . }}
  namespace: {{ include "kubeovn.centralNamespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubeovn.centralName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeovn.centralName" . }}
    namespace: {{ include "kubeovn.centralNamespace" . }}
{{- end }}
