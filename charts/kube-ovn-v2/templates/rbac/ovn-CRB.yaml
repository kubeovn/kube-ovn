{{- $ovnServiceAccountName := include "kubeovn.ovnServiceAccountName" . -}}
{{- $ovsServiceAccountName := include "kubeovn.ovsServiceAccountName" . -}}
{{- $appServiceAccountName := include "kubeovn.appServiceAccountName" . -}}
{{- $ovnClusterRoleName := include "kubeovn.ovnClusterRoleName" . -}}
{{- $ovsClusterRoleName := include "kubeovn.ovsClusterRoleName" . -}}
{{- $appClusterRoleName := include "kubeovn.appClusterRoleName" . -}}
{{- $ovnRoleBindingName := include "kubeovn.resourceName" (dict "context" . "suffix" "ovn") -}}
{{- $ovsRoleBindingName := include "kubeovn.resourceName" (dict "context" . "suffix" "ovn-ovs") -}}
{{- $appRoleBindingName := include "kubeovn.resourceName" (dict "context" . "suffix" "app") -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $ovnRoleBindingName }}
roleRef:
  name: {{ $ovnClusterRoleName }}
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: {{ $ovnServiceAccountName }}
    namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $ovnRoleBindingName }}
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: {{ $ovnServiceAccountName }}
    namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $ovsRoleBindingName }}
roleRef:
  name: {{ $ovsClusterRoleName }}
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: {{ $ovsServiceAccountName }}
    namespace: {{ .Values.namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $appRoleBindingName }}
roleRef:
  name: {{ $appClusterRoleName }}
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: {{ $appServiceAccountName }}
    namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $appRoleBindingName }}
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: {{ $appServiceAccountName }}
    namespace: {{ .Values.namespace }}
