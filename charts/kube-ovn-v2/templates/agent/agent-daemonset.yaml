{{- $agentImage := include "kubeovn.imageSpec" (dict "root" . "image" .Values.agent.image) | fromYaml -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-ovn-cni
  namespace: {{ .Values.namespace }}
  {{- with .Values.agent.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.agent.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-ovn-cni
      app.kubernetes.io/part-of: kube-ovn
  template:
    metadata:
      {{- with .Values.agent.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: kube-ovn-cni
        app.kubernetes.io/part-of: kube-ovn
        {{- with .Values.agent.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # Legacy labels
        app: kube-ovn-cni
        component: network
        type: infra
    spec:
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
        - key: CriticalAddonsOnly
          operator: Exists
      priorityClassName: system-node-critical
      serviceAccountName: kube-ovn-cni
      automountServiceAccountToken: true
      hostNetwork: true
      hostPID: true
      securityContext:
        {{- if .Values.features.enableTproxy }}
        fsGroup: 65534
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: hostpath-init
        image: {{ $agentImage.prefix }}{{ $agentImage.repository }}:{{ $agentImage.tag }}
        imagePullPolicy: {{ $agentImage.pullPolicy }}
        command:
          - sh
          - -xec
          - |
            chmod +t /usr/local/sbin
            chown -R nobody: /var/log/kube-ovn
            chown 0:65534 /run/kube-ovn-ipsec-protection
            chmod 0750 /run/kube-ovn-ipsec-protection
            iptables -V
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            drop:
              - ALL
          privileged: true
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
          - name: ipsec-protection
            mountPath: /run/kube-ovn-ipsec-protection
          - name: usr-local-sbin
            mountPath: /usr/local/sbin
          - mountPath: /run/xtables.lock
            name: xtables-lock
            readOnly: false
          - mountPath: /var/run/netns
            name: host-ns
            readOnly: false
          - name: kube-ovn-log
            mountPath: /var/log/kube-ovn
      - name: install-cni
        image: {{ $agentImage.prefix }}{{ $agentImage.repository }}:{{ $agentImage.tag }}
        imagePullPolicy: {{ $agentImage.pullPolicy }}
        command:
          - /kube-ovn/install-cni.sh
          - --cni-conf-dir={{ .Values.cni.mountConfigDirectory }}
          - --cni-conf-file={{ .Values.cni.localConfigFile }}
          - --cni-conf-name={{- .Values.cni.configPriority -}}-kube-ovn.conflist
        env:
          - name: POD_IPS
            valueFrom:
              fieldRef:
                fieldPath: status.podIPs
        securityContext:
          runAsUser: 0
          privileged: true
        volumeMounts:
          - mountPath: /opt/cni/bin
            name: cni-bin
          - mountPath: {{ .Values.cni.mountConfigDirectory }}
            name: cni-conf
          {{- if .Values.cni.mountToolingDirectory }}
          - mountPath: /usr/local/bin
            name: local-bin
          {{- end }}
      {{- if not .Values.features.enableOvnIpsec }}
      - name: ipsec-cleanup
        image: {{ $agentImage.prefix }}{{ $agentImage.repository }}:{{ $agentImage.tag }}
        imagePullPolicy: {{ $agentImage.pullPolicy }}
        command:
          - /kube-ovn/kube-ovn-ipsec
        args:
          - --cleanup-only
        securityContext:
          runAsUser: 0
          runAsGroup: 65534
          privileged: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - NET_ADMIN
              - NET_BIND_SERVICE
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
        volumeMounts:
          - name: ipsec-protection
            mountPath: /run/kube-ovn-ipsec-protection
          - name: ovs-ipsec-keys
            mountPath: /etc/ovs_ipsec_keys
          - name: host-run-ovs
            mountPath: /run/openvswitch
            readOnly: true
        resources:
          {{- toYaml .Values.ipsec.resources | nindent 10 }}
      {{- end }}
      containers:
      - name: cni-server
        image: {{ $agentImage.prefix }}{{ $agentImage.repository }}:{{ $agentImage.tag }}
        imagePullPolicy: {{ $agentImage.pullPolicy }}
        command:
          - bash
          - /kube-ovn/start-cniserver.sh
        args:
          - --enable-mirror={{- .Values.agent.mirroring.enabled }}
          - --mirror-iface={{- .Values.agent.mirroring.interface }}
          - --node-switch={{ .Values.networking.join.subnetName }}
          - --encap-checksum=true
          {{- if eq .Values.networking.networkType "vlan" }}
          - --iface=
          {{- else}}
          - --iface={{- .Values.agent.interface }}
          {{- end }}
          - --service-cluster-ip-range=
          {{- if eq .Values.networking.stack "Dual" -}}
          {{ .Values.networking.services.cidr.v4 }},{{ .Values.networking.services.cidr.v6 }}
          {{- else if eq .Values.networking.stack "IPv4" -}}
          {{ .Values.networking.services.cidr.v4 }}
          {{- else if eq .Values.networking.stack "IPv6" -}}
          {{ .Values.networking.services.cidr.v6 }}
          {{- end }}
          {{- if (gt (int .Values.networking.pods.mtu) 0) }}
          - --mtu={{ .Values.networking.pods.mtu  }}
          {{- end }}
          {{- if (gt (int .Values.networking.maxMtu) 0) }}
          - --max-mtu={{ .Values.networking.maxMtu }}
          {{- end }}
          - --dpdk-tunnel-iface={{- .Values.agent.dpdkTunnelInterface }}
          - --network-type={{- .Values.networking.tunnelType }}
          - --default-interface-name={{- .Values.networking.vlan.interfaceName }}
          {{- if .Values.networking.externalGatewaySwitch }}
          - --external-gateway-switch={{- .Values.networking.externalGatewaySwitch }}
          {{- end }}
          - --logtostderr=false
          - --alsologtostderr=true
          - --log_file=/var/log/kube-ovn/kube-ovn-cni.log
          - --log_file_max_size=200
          - --enable-metrics={{- .Values.networking.enableMetrics }}
          {{- if .Values.agent.gatewayNetfilterMode }}
          - --gateway-netfilter-mode={{- .Values.agent.gatewayNetfilterMode }}
          {{- end }}
          {{- if .Values.agent.kubeProxyModeEndpoint }}
          - --kube-proxy-mode-endpoint={{- .Values.agent.kubeProxyModeEndpoint }}
          {{- end }}
          {{- if .Values.agent.gatewayNetfilterDetectTimeout }}
          - --gateway-netfilter-detect-timeout={{- .Values.agent.gatewayNetfilterDetectTimeout }}
          {{- end }}
          - --kubelet-dir={{ .Values.kubelet.directory }}
          - --enable-tproxy={{ .Values.features.enableTproxy }}
          - --ovs-vsctl-concurrency={{ .Values.performance.ovsVsctlConcurrency }}
          - --secure-serving={{- .Values.features.enableSecureServing }}
          {{- if or .Values.networking.tlsMinVersion .Values.networking.tlsMaxVersion .Values.networking.tlsCipherSuites }}
          {{- include "kubeovn.componentTLSArgs" . | nindent 10 }}
          {{- end }}
          - --host-tunnel-src={{- .Values.features.enableHostTunnelSrc | default false }}
          - --non-primary-cni-mode={{- .Values.cni.nonPrimaryCNI }}
          {{- if .Values.aclSampling.enabled }}
          - --enable-acl-sampling=true
          - --acl-sampling-set-id={{- .Values.aclSampling.setID }}
          - --acl-sampling-local-group-id={{- .Values.aclSampling.localGroupID }}
          {{- end }}
        securityContext:
          runAsGroup: {{ include "kubeovn.runAsUser" . }}
          runAsUser: {{ include "kubeovn.runAsUser" . }}
          privileged: false
          allowPrivilegeEscalation: true
          capabilities:
            drop:
              - SYS_NICE
            add:
              - NET_ADMIN
              - NET_BIND_SERVICE
              - NET_RAW
        env:
          - name: ENABLE_SSL
            value: "{{ .Values.networking.enableSsl }}"
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_IPS
            valueFrom:
              fieldRef:
                fieldPath: status.podIPs
          - name: ENABLE_BIND_LOCAL_IP
            value: "{{- .Values.features.ENABLE_BIND_LOCAL_IP }}"
          - name: DBUS_SYSTEM_BUS_ADDRESS
            value: "unix:path=/host/var/run/dbus/system_bus_socket"
          {{- with .Values.agent.extraEnv }}
            {{- toYaml . | nindent 10 }}
          {{- end }}
        volumeMounts:
          {{- if .Values.features.enableTproxy }}
          - name: tproxy-socket
            mountPath: /run/kube-ovn-tproxy
          {{- end }}
          - name: usr-local-sbin
            mountPath: /usr/local/sbin
          - name: host-modules
            mountPath: /lib/modules
            readOnly: true
          - mountPath: /run/xtables.lock
            name: xtables-lock
            readOnly: false
          - name: shared-dir
            mountPath: {{ .Values.kubelet.directory }}/pods
          - mountPath: /etc/openvswitch
            name: systemid
            readOnly: true
          - mountPath: /run/openvswitch
            name: host-run-ovs
            mountPropagation: HostToContainer
          - mountPath: /run/ovn
            name: host-run-ovn
          - mountPath: /host/var/run/dbus
            name: host-dbus
            mountPropagation: HostToContainer
          - mountPath: /var/run/netns
            name: host-ns
            mountPropagation: HostToContainer
          - mountPath: /var/log/kube-ovn
            name: kube-ovn-log
          - mountPath: /var/log/openvswitch
            name: host-log-ovs
          - mountPath: /var/log/ovn
            name: host-log-ovn
          - mountPath: /etc/localtime
            name: localtime
            readOnly: true
        readinessProbe:
          failureThreshold: 3
          periodSeconds: 7
          successThreshold: 1
          httpGet:
            port: 10665
            path: /readyz
            scheme: '{{ ternary "HTTPS" "HTTP" .Values.features.enableSecureServing }}'
          timeoutSeconds: 5
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 7
          successThreshold: 1
          httpGet:
            port: 10665
            path: /readyz
            scheme: '{{ ternary "HTTPS" "HTTP" .Values.features.enableSecureServing }}'
          timeoutSeconds: 5
        {{- with .Values.agent.resources }}
        resources:
          {{- toYaml . | trim | nindent 10 }}
        {{- end }}
      {{- if .Values.features.enableTproxy }}
      - name: tproxy
        image: {{ $agentImage.prefix }}{{ $agentImage.repository }}:{{ $agentImage.tag }}
        imagePullPolicy: {{ $agentImage.pullPolicy }}
        command:
          - /kube-ovn/kube-ovn-tproxy
        securityContext:
          runAsUser: 65534
          runAsNonRoot: true
          runAsGroup: 0
          privileged: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - SYS_ADMIN
        volumeMounts:
          - name: tproxy-socket
            mountPath: /run/kube-ovn-tproxy
          - name: host-run-ovs
            mountPath: /run/openvswitch
            readOnly: true
          - name: host-ns
            mountPath: /var/run/netns
            readOnly: true
            mountPropagation: HostToContainer
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
      {{- end }}
      {{- if .Values.features.enableOvnIpsec }}
      - name: ipsec
        image: {{ $agentImage.prefix }}{{ $agentImage.repository }}:{{ $agentImage.tag }}
        imagePullPolicy: {{ $agentImage.pullPolicy }}
        command:
          - /kube-ovn/kube-ovn-ipsec
        args:
          - --ovn-ipsec-cert-duration={{ .Values.ipsec.certificateDuration | int64 }}
          - --request-timeout={{ .Values.ipsec.requestTimeout }}
          - --priority={{ .Values.ipsec.priority }}
        securityContext:
          runAsUser: 0
          runAsGroup: 65534
          privileged: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - NET_ADMIN
              - NET_BIND_SERVICE
              - SYS_NICE
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
        volumeMounts:
          - name: ipsec-protection
            mountPath: /run/kube-ovn-ipsec-protection
          - name: ovs-ipsec-keys
            mountPath: /etc/ovs_ipsec_keys
          - name: host-run-ovs
            mountPath: /run/openvswitch
            readOnly: true
        startupProbe:
          exec:
            command: [/kube-ovn/kube-ovn-ipsec, --check=livez]
          failureThreshold: 60
          periodSeconds: 5
        livenessProbe:
          exec:
            command: [/kube-ovn/kube-ovn-ipsec, --check=livez]
          periodSeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          exec:
            command: [/kube-ovn/kube-ovn-ipsec, --check=readyz]
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          {{- toYaml .Values.ipsec.resources | nindent 10 }}
      {{- end }}
      nodeSelector:
        kubernetes.io/os: "linux"
      volumes:
        - name: ipsec-protection
          hostPath:
            path: /run/kube-ovn-ipsec-protection
            type: DirectoryOrCreate
        {{- if .Values.features.enableTproxy }}
        - name: tproxy-socket
          emptyDir: {}
        {{- end }}
        - name: usr-local-sbin
          emptyDir: {}
        - name: host-modules
          hostPath:
            path: /lib/modules
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
        - name: shared-dir
          hostPath:
            path: {{ .Values.kubelet.directory }}/pods
        - name: systemid
          hostPath:
            path: {{ .Values.ovsOvn.ovsDirectory }}
        - name: host-run-ovs
          hostPath:
            path: /run/openvswitch
        - name: host-run-ovn
          hostPath:
            path: /run/ovn
        - name: cni-conf
          hostPath:
            path: {{ .Values.cni.configDirectory }}
        - name: cni-bin
          hostPath:
            path: {{ .Values.cni.binaryDirectory }}
        - name: host-ns
          hostPath:
            path: /var/run/netns
        - name: host-dbus
          hostPath:
            path: /var/run/dbus
        - name: kube-ovn-log
          hostPath:
            path: {{ .Values.logging.directory }}/kube-ovn
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: host-log-ovs
          hostPath:
            path: {{ .Values.logging.directory }}/openvswitch
        - name: host-log-ovn
          hostPath:
            path: {{ .Values.logging.directory }}/ovn
        {{- if .Values.cni.mountToolingDirectory }}
        - name: local-bin
          hostPath:
            path: {{ .Values.cni.toolingDirectory }}
        {{- end }}
        - name: ovs-ipsec-keys
          hostPath:
            path: {{ .Values.ovsOvn.ovsIpsecKeysDirectory }}
