{{- $agentName := include "kubeovn.agentName" . -}}
{{- $agentServiceAccountName := include "kubeovn.agentServiceAccountName" . -}}
{{- $agentClusterRoleName := include "kubeovn.agentClusterRoleName" . -}}
{{- $agentSecretReaderRoleName := include "kubeovn.resourceName" (dict "context" . "suffix" "secret-reader-ovn-ipsec") -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $agentName }}
  {{- with .Values.agent.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.agent.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  name: {{ $agentClusterRoleName }}
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: {{ $agentServiceAccountName }}
    namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubeovn.resourceName" (dict "context" . "suffix" "cni-secret-reader") }}
  namespace: {{ .Values.namespace }}
subjects:
- kind: ServiceAccount
  name: {{ $agentServiceAccountName }}
  namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: {{ $agentSecretReaderRoleName }}
  apiGroup: rbac.authorization.k8s.io
