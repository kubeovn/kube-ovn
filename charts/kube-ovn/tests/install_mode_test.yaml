suite: Install mode resource boundaries
templates:
  - kube-ovn-crd.yaml
  - pre-upgrade-ovs-ovn.yaml
  - upgrade-ovs-ovn.yaml
  - post-delete-hook.yaml
tests:
  - it: does not render data-plane CRDs for controlPlaneOnly
    template: kube-ovn-crd.yaml
    set:
      installMode: controlPlaneOnly
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render pre-upgrade hooks for controlPlaneOnly
    template: pre-upgrade-ovs-ovn.yaml
    set:
      installMode: controlPlaneOnly
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render post-upgrade hooks for controlPlaneOnly
    template: upgrade-ovs-ovn.yaml
    set:
      installMode: controlPlaneOnly
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render post-delete cleanup for controlPlaneOnly
    template: post-delete-hook.yaml
    set:
      installMode: controlPlaneOnly
    asserts:
      - hasDocuments:
          count: 0

  - it: renders data-plane CRDs for dataPlaneOnly
    template: kube-ovn-crd.yaml
    set:
      installMode: dataPlaneOnly
      externalOvnCentral.nbEndpoint: 10.0.0.10
      externalOvnCentral.sbEndpoint: 10.0.0.10
    asserts:
      - isKind:
          of: CustomResourceDefinition

  - it: renders pre-upgrade hooks for dataPlaneOnly with external OVN addresses
    template: pre-upgrade-ovs-ovn.yaml
    kubernetesProvider:
      scheme:
        "apps/v1/DaemonSet":
          gvr:
            group: apps
            version: v1
            resource: daemonsets
          namespaced: true
        "v1/Node":
          gvr:
            version: v1
            resource: nodes
          namespaced: false
      objects:
        - kind: DaemonSet
          apiVersion: apps/v1
          metadata:
            name: ovs-ovn
            namespace: kube-system
            annotations:
              chart-version: old
    documentSelector:
      path: kind
      value: Job
    set:
      installMode: dataPlaneOnly
      externalOvnCentral.nbEndpoint: 10.0.0.10
      externalOvnCentral.sbEndpoint: 10.0.0.10
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INSTALL_MODE
            value: dataPlaneOnly
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OVN_NB_ADDR
            value: tcp:10.0.0.10:6641
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OVN_SB_ADDR
            value: tcp:10.0.0.10:6642

  - it: renders post-upgrade hooks for dataPlaneOnly with external OVN addresses
    template: upgrade-ovs-ovn.yaml
    kubernetesProvider:
      scheme:
        "apps/v1/DaemonSet":
          gvr:
            group: apps
            version: v1
            resource: daemonsets
          namespaced: true
        "v1/Node":
          gvr:
            version: v1
            resource: nodes
          namespaced: false
      objects:
        - kind: DaemonSet
          apiVersion: apps/v1
          metadata:
            name: ovs-ovn
            namespace: kube-system
            annotations:
              chart-version: old
    documentSelector:
      path: kind
      value: Job
    set:
      installMode: dataPlaneOnly
      externalOvnCentral.nbEndpoint: 10.0.0.10
      externalOvnCentral.sbEndpoint: 10.0.0.10
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INSTALL_MODE
            value: dataPlaneOnly
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OVN_NB_ADDR
            value: tcp:10.0.0.10:6641
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OVN_SB_ADDR
            value: tcp:10.0.0.10:6642

  - it: renders post-delete cleanup for dataPlaneOnly
    template: post-delete-hook.yaml
    set:
      installMode: dataPlaneOnly
      externalOvnCentral.nbEndpoint: 10.0.0.10
      externalOvnCentral.sbEndpoint: 10.0.0.10
    asserts:
      - hasDocuments:
          count: 4
