suite: Kube-OVN monitor deployment
templates:
  - monitor-deploy.yaml
tests:
  - it: uses one replica by default
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: supports a custom replica count
    set:
      kube-ovn-monitor.replicas: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3
