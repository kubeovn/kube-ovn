{{- if include "kubeovn.renderDataPlane" . }}
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: kube-ovn-cni
  namespace: {{ .Values.namespace }}
  annotations:
    kubernetes.io/description: |
      This daemon set launches the kube-ovn cni daemon.
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: kube-ovn-cni
  template:
    metadata:
      labels:
        app: kube-ovn-cni
        component: network
        type: infra
    spec:
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
        - key: CriticalAddonsOnly
          operator: Exists
      priorityClassName: system-node-critical
      serviceAccountName: kube-ovn-cni
      automountServiceAccountToken: true
      hostNetwork: true
      hostPID: true
      securityContext:
        {{- if .Values.func.ENABLE_TPROXY }}
        fsGroup: 65534
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: hostpath-init
        image: {{ .Values.global.registry.address }}/{{ .Values.global.images.kubeovn.repository }}:{{ .Values.global.images.kubeovn.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
          - sh
          - -xec
          - |
            chmod +t /usr/local/sbin
            chown -R nobody: /var/log/kube-ovn
            chown 0:65534 /run/kube-ovn-ipsec-protection
            chmod 0750 /run/kube-ovn-ipsec-protection
            iptables -V
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            drop:
              - ALL
          privileged: true
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
          - name: ipsec-protection
            mountPath: /run/kube-ovn-ipsec-protection
          - name: usr-local-sbin
            mountPath: /usr/local/sbin
          - mountPath: /run/xtables.lock
            name: xtables-lock
            readOnly: false
          - mountPath: /var/run/netns
            name: host-ns
            readOnly: false
          - name: kube-ovn-log
            mountPath: /var/log/kube-ovn
      - name: install-cni
        image: {{ .Values.global.registry.address }}/{{ .Values.global.images.kubeovn.repository }}:{{ .Values.global.images.kubeovn.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
          - /kube-ovn/install-cni.sh
          - --cni-conf-dir={{ .Values.cni_conf.MOUNT_CNI_CONF_DIR }}
          - --cni-conf-file={{ .Values.cni_conf.CNI_CONF_FILE }}
          - --cni-conf-name={{- .Values.cni_conf.CNI_CONFIG_PRIORITY -}}-kube-ovn.conflist
        env:
          - name: POD_IPS
            valueFrom:
              fieldRef:
                fieldPath: status.podIPs
        securityContext:
          runAsUser: 0
          privileged: true
        volumeMounts:
          - mountPath: /opt/cni/bin
            name: cni-bin
          - mountPath: {{ .Values.cni_conf.MOUNT_CNI_CONF_DIR }}
            name: cni-conf
          {{- if .Values.cni_conf.MOUNT_LOCAL_BIN_DIR }}
          - mountPath: /usr/local/bin
            name: local-bin
          {{- end }}
      {{- if not .Values.func.ENABLE_OVN_IPSEC }}
      - name: ipsec-cleanup
        image: {{ .Values.global.registry.address }}/{{ .Values.global.images.kubeovn.repository }}:{{ .Values.global.images.kubeovn.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
          - /kube-ovn/kube-ovn-ipsec
        args:
          - --cleanup-only
        securityContext:
          runAsUser: 0
          runAsGroup: 65534
          privileged: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - NET_ADMIN
              - NET_BIND_SERVICE
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
        volumeMounts:
          - name: ipsec-protection
            mountPath: /run/kube-ovn-ipsec-protection
          - name: ovs-ipsec-keys
            mountPath: /etc/ovs_ipsec_keys
          - name: host-run-ovs
            mountPath: /run/openvswitch
            readOnly: true
        resources:
          {{- toYaml .Values.ipsec.resources | nindent 10 }}
      {{- end }}
      containers:
      - name: cni-server
        image: {{ .Values.global.registry.address }}/{{ .Values.global.images.kubeovn.repository }}:{{ .Values.global.images.kubeovn.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
          - bash
          - /kube-ovn/start-cniserver.sh
        args:
          - --enable-mirror={{- .Values.debug.ENABLE_MIRROR }}
          - --mirror-iface={{- .Values.debug.MIRROR_IFACE }}
          - --node-switch={{ .Values.networking.NODE_SUBNET }}
          - --encap-checksum=true
          - --service-cluster-ip-range=
          {{- if eq .Values.networking.NET_STACK "dual_stack" -}}
          {{ .Values.dual_stack.SVC_CIDR }}
          {{- else if eq .Values.networking.NET_STACK "ipv4" -}}
          {{ .Values.ipv4.SVC_CIDR }}
          {{- else if eq .Values.networking.NET_STACK "ipv6" -}}
          {{ .Values.ipv6.SVC_CIDR }}
          {{- end }}
          {{- if eq .Values.networking.NETWORK_TYPE "vlan" }}
          - --iface=
          {{- else}}
          - --iface={{- .Values.networking.IFACE }}
          {{- end }}
          - --dpdk-tunnel-iface={{- .Values.networking.DPDK_TUNNEL_IFACE }}
          - --network-type={{- .Values.networking.TUNNEL_TYPE }}
          - --default-interface-name={{- .Values.networking.vlan.VLAN_INTERFACE_NAME }}
          {{- if .Values.networking.EXTERNAL_GATEWAY_SWITCH }}
          - --external-gateway-switch={{- .Values.networking.EXTERNAL_GATEWAY_SWITCH }}
          {{- end }}
          - --logtostderr=false
          - --alsologtostderr=true
          - --log_file=/var/log/kube-ovn/kube-ovn-cni.log
          - --log_file_max_size=200
          - --enable-metrics={{- .Values.networking.ENABLE_METRICS }}
          {{- if .Values.networking.GATEWAY_NETFILTER_MODE }}
          - --gateway-netfilter-mode={{- .Values.networking.GATEWAY_NETFILTER_MODE }}
          {{- end }}
          {{- if .Values.networking.KUBE_PROXY_MODE_ENDPOINT }}
          - --kube-proxy-mode-endpoint={{- .Values.networking.KUBE_PROXY_MODE_ENDPOINT }}
          {{- end }}
          {{- if .Values.networking.GATEWAY_NETFILTER_DETECT_TIMEOUT }}
          - --gateway-netfilter-detect-timeout={{- .Values.networking.GATEWAY_NETFILTER_DETECT_TIMEOUT }}
          {{- end }}
          - --kubelet-dir={{ .Values.kubelet_conf.KUBELET_DIR }}
          - --enable-tproxy={{ .Values.func.ENABLE_TPROXY }}
          - --ovs-vsctl-concurrency={{ .Values.performance.OVS_VSCTL_CONCURRENCY }}
          - --secure-serving={{- .Values.func.SECURE_SERVING }}
          {{- if or .Values.networking.TLS_MIN_VERSION .Values.networking.TLS_MAX_VERSION .Values.networking.TLS_CIPHER_SUITES }}
          {{- include "kubeovn.componentTLSArgs" . | nindent 10 }}
          {{- end }}
          - --set-vxlan-tx-off={{- .Values.func.SET_VXLAN_TX_OFF }}
          - --host-tunnel-src={{- .Values.func.HOST_TUNNEL_SRC | default false }}
          - --non-primary-cni-mode={{- .Values.cni_conf.NON_PRIMARY_CNI }}
          - --enable-acl-sampling={{- .Values.aclSampling.enabled }}
          - --acl-sampling-set-id={{- .Values.aclSampling.setID }}
          - --acl-sampling-local-group-id={{- .Values.aclSampling.localGroupID }}
        securityContext:
          runAsGroup: {{ include "kubeovn.runAsUser" . }}
          runAsUser: {{ include "kubeovn.runAsUser" . }}
          privileged: false
          allowPrivilegeEscalation: true
          capabilities:
            drop:
              - SYS_NICE
            add:
              - NET_ADMIN
              - NET_BIND_SERVICE
              - NET_RAW
        env:
          - name: ENABLE_SSL
            value: "{{ .Values.networking.ENABLE_SSL }}"
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_IPS
            valueFrom:
              fieldRef:
                fieldPath: status.podIPs
          - name: ENABLE_BIND_LOCAL_IP
            value: "{{- .Values.func.ENABLE_BIND_LOCAL_IP }}"
          - name: DBUS_SYSTEM_BUS_ADDRESS
            value: "unix:path=/host/var/run/dbus/system_bus_socket"
        volumeMounts:
          {{- if .Values.func.ENABLE_TPROXY }}
          - name: tproxy-socket
            mountPath: /run/kube-ovn-tproxy
          {{- end }}
          - name: usr-local-sbin
            mountPath: /usr/local/sbin
          - name: host-modules
            mountPath: /lib/modules
            readOnly: true
          - mountPath: /run/xtables.lock
            name: xtables-lock
            readOnly: false
          - name: shared-dir
            mountPath: {{ .Values.kubelet_conf.KUBELET_DIR }}/pods
          - mountPath: /etc/openvswitch
            name: systemid
            readOnly: true
          - mountPath: /run/openvswitch
            name: host-run-ovs
            mountPropagation: HostToContainer
          - mountPath: /run/ovn
            name: host-run-ovn
          - mountPath: /host/var/run/dbus
            name: host-dbus
            mountPropagation: HostToContainer
          - mountPath: /var/run/netns
            name: host-ns
            mountPropagation: HostToContainer
          - mountPath: /var/log/kube-ovn
            name: kube-ovn-log
          - mountPath: /var/log/openvswitch
            name: host-log-ovs
          - mountPath: /var/log/ovn
            name: host-log-ovn
          - mountPath: /etc/localtime
            name: localtime
            readOnly: true
        readinessProbe:
          failureThreshold: 3
          periodSeconds: 7
          successThreshold: 1
          httpGet:
            port: 10665
            path: /readyz
            scheme: '{{ ternary "HTTPS" "HTTP" .Values.func.SECURE_SERVING }}'
          timeoutSeconds: 5
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 7
          successThreshold: 1
          httpGet:
            port: 10665
            path: /livez
            scheme: '{{ ternary "HTTPS" "HTTP" .Values.func.SECURE_SERVING }}'
          timeoutSeconds: 5
        resources:
          requests:
            cpu: {{ index .Values "kube-ovn-cni" "requests" "cpu" }}
            memory: {{ index .Values "kube-ovn-cni" "requests" "memory" }}
          limits:
            cpu: {{ index .Values "kube-ovn-cni" "limits" "cpu" }}
            memory: {{ index .Values "kube-ovn-cni" "limits" "memory" }}
            ephemeral-storage: {{ index .Values "kube-ovn-cni" "limits" "ephemeral-storage" }}
      {{- if .Values.func.ENABLE_TPROXY }}
      - name: tproxy
        image: {{ .Values.global.registry.address }}/{{ .Values.global.images.kubeovn.repository }}:{{ .Values.global.images.kubeovn.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
          - /kube-ovn/kube-ovn-tproxy
        securityContext:
          runAsUser: 65534
          runAsNonRoot: true
          runAsGroup: 0
          privileged: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - SYS_ADMIN
        volumeMounts:
          - name: tproxy-socket
            mountPath: /run/kube-ovn-tproxy
          - name: host-run-ovs
            mountPath: /run/openvswitch
            readOnly: true
          - name: host-ns
            mountPath: /var/run/netns
            readOnly: true
            mountPropagation: HostToContainer
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
      {{- end }}
      {{- if .Values.func.ENABLE_OVN_IPSEC }}
      - name: ipsec
        image: {{ .Values.global.registry.address }}/{{ .Values.global.images.kubeovn.repository }}:{{ .Values.global.images.kubeovn.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
          - /kube-ovn/kube-ovn-ipsec
        args:
          - --ovn-ipsec-cert-duration={{ .Values.ipsec.certificateDuration | int64 }}
          - --request-timeout={{ .Values.ipsec.requestTimeout }}
          - --priority={{ .Values.ipsec.priority }}
        securityContext:
          runAsUser: 0
          runAsGroup: 65534
          privileged: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - NET_ADMIN
              - NET_BIND_SERVICE
              - SYS_NICE
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
        volumeMounts:
          - name: ipsec-protection
            mountPath: /run/kube-ovn-ipsec-protection
          - name: ovs-ipsec-keys
            mountPath: /etc/ovs_ipsec_keys
          - name: host-run-ovs
            mountPath: /run/openvswitch
            readOnly: true
        startupProbe:
          exec:
            command: [/kube-ovn/kube-ovn-ipsec, --check=livez]
          failureThreshold: 60
          periodSeconds: 5
        livenessProbe:
          exec:
            command: [/kube-ovn/kube-ovn-ipsec, --check=livez]
          periodSeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          exec:
            command: [/kube-ovn/kube-ovn-ipsec, --check=readyz]
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          {{- toYaml .Values.ipsec.resources | nindent 10 }}
      {{- end }}
      nodeSelector:
        kubernetes.io/os: "linux"
      volumes:
        - name: ipsec-protection
          hostPath:
            path: /run/kube-ovn-ipsec-protection
            type: DirectoryOrCreate
        {{- if .Values.func.ENABLE_TPROXY }}
        - name: tproxy-socket
          emptyDir: {}
        {{- end }}
        - name: usr-local-sbin
          emptyDir: {}
        - name: host-modules
          hostPath:
            path: /lib/modules
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
        - name: shared-dir
          hostPath:
            path: {{ .Values.kubelet_conf.KUBELET_DIR }}/pods
        - name: systemid
          hostPath:
            path: {{ .Values.OPENVSWITCH_DIR }}
        - name: host-run-ovs
          hostPath:
            path: /run/openvswitch
        - name: host-run-ovn
          hostPath:
            path: /run/ovn
        - name: cni-conf
          hostPath:
            path: {{ .Values.cni_conf.CNI_CONF_DIR }}
        - name: cni-bin
          hostPath:
            path: {{ .Values.cni_conf.CNI_BIN_DIR }}
        - name: host-ns
          hostPath:
            path: /var/run/netns
        - name: host-dbus
          hostPath:
            path: /var/run/dbus
        - name: kube-ovn-log
          hostPath:
            path: {{ .Values.log_conf.LOG_DIR }}/kube-ovn
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: host-log-ovs
          hostPath:
            path: {{ .Values.log_conf.LOG_DIR }}/openvswitch
        - name: host-log-ovn
          hostPath:
            path: {{ .Values.log_conf.LOG_DIR }}/ovn
        {{- if .Values.cni_conf.MOUNT_LOCAL_BIN_DIR }}
        - name: local-bin
          hostPath:
            path: {{ .Values.cni_conf.LOCAL_BIN_DIR }}
        {{- end }}
        - name: ovs-ipsec-keys
          hostPath:
            path: {{ .Values.OVN_IPSEC_KEY_DIR }}
            type: DirectoryOrCreate

{{- end }}
