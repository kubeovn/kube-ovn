name: Route x86 E2E events to the candidate PR

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]
  push:
    branches: ['release-*']
  workflow_run:
    workflows: [Build x86 Image]
    types: [completed]

permissions:
  contents: write
  actions: write
  pull-requests: read
  issues: read

jobs:
  route:
    name: Forward events to the exact current PR HEAD
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the event router
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate the source and prepare candidate dispatches
        id: prepare
        run: >-
          python3 hack/e2e_pr_router.py prepare
          --event-file "$GITHUB_EVENT_PATH"
          --event-name "$GITHUB_EVENT_NAME"
          --output-dir router-event
      - name: Preserve canonical source events for candidate authentication
        if: steps.prepare.outputs.route == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: x86-e2e-router-event-${{ github.run_attempt }}
          path: router-event/source-events.json
          retention-days: 3
      - name: Dispatch the candidate workflows in sequence
        if: steps.prepare.outputs.route == 'true'
        run: python3 hack/e2e_pr_router.py dispatch-prepared --routes-file router-event/routes.json
