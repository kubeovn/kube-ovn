name: Lint and Test Charts

on:
  pull_request:
    paths:
      - 'charts/kube-ovn/**'
      - 'charts/kube-ovn-v2/**'
      - '.github/workflows/helm-testing.yaml'
      - 'hack/kubectl-ko-chart-test.sh'
      - 'hack/test-kubectl-ko-chart.py'
      - 'hack/test-non-root-nft.sh'
      - 'dist/images/Dockerfile'
      - 'dist/images/Dockerfile.base'
      - 'pkg/daemon/ovs_linux.go'
      - 'pkg/daemon/vlan_interfaces_linux_test.go'


permissions: {}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      KUBE_OVN_IMAGE_TAG: ci-${{ github.sha }}
    permissions:
      contents: read
    strategy:
      matrix:
        ip-family: [ "ipv4" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: Run chart-testing (lint)
        run: |
          python3 hack/test-tproxy-container.py
          python3 hack/test-kubectl-ko-chart.py
          ct lint --target-branch ${{ github.event.repository.default_branch }} --config charts/kube-ovn-v2/ct.yaml
          # Lint the legacy chart separately; it is intentionally not installed in the shared Kind cluster.
          ct lint --target-branch ${{ github.event.repository.default_branch }} --config charts/kube-ovn/ct.yaml

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build candidate image
        run: |
          make build-go
          docker build --build-arg VERSION="$(cat VERSION)" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "kubeovn/kube-ovn:$KUBE_OVN_IMAGE_TAG" \
            -f dist/images/Dockerfile dist/images/

      - name: Verify nft and VLAN operations with the non-root daemon UID
        run: |
          bash hack/test-non-root-nft.sh "kubeovn/kube-ovn:$KUBE_OVN_IMAGE_TAG"
          nonroot_test_dir=$(mktemp -d /tmp/kube-ovn-nonroot.XXXXXX)
          trap 'rm -rf "$nonroot_test_dir"' EXIT
          go test -c -o "$nonroot_test_dir/daemon.test" ./pkg/daemon
          # UID 65534 must be able to traverse the directory and run the binary.
          chmod 0755 "$nonroot_test_dir" "$nonroot_test_dir/daemon.test"
          sudo env KUBE_OVN_NONROOT_VLAN_TEST_HELPER=1 \
            unshare --user --map-user=65534 --map-group=65534 --net --keep-caps \
            "$nonroot_test_dir/daemon.test" -test.run='^TestNonRootVlanLifecycle$' -test.v

      - name: Install kind
        uses: helm/kind-action@v1.15.1
        with:
          version: ${{ env.KIND_VERSION }}
          install_only: true

      - name: Create kind cluster
        run: |
          sudo pip3 install jinjanator j2cli
          sudo env "PATH=$HOME/.local/bin:$PATH" make kind-init-${{ matrix.ip-family }}
          sudo cp -r /root/.kube/ "$HOME/.kube/"
          sudo chown -R "$(id -un):" "$HOME/.kube/"

      - name: Load candidate image
        run: make kind-load-image VERSION="$KUBE_OVN_IMAGE_TAG"

      - name: Run chart-testing (install)
        id: install
        run: |
          timeout 120 bash -c 'until kubectl get node -l node-role.kubernetes.io/control-plane -o name 2>/dev/null | grep -q .; do echo "Waiting for control-plane nodes to be labeled..."; sleep 2; done'
          kubectl label node --overwrite -l node-role.kubernetes.io/control-plane kube-ovn/role=master
          # Test this checkout's image; published images may require different capabilities.
          ct install --target-branch ${{ github.event.repository.default_branch }} --config charts/kube-ovn-v2/ct.yaml \
            --helm-extra-set-args "--set-string global.images.kubeovn.tag=$KUBE_OVN_IMAGE_TAG --set image.pullPolicy=Never"

      - name: Verify independent node agent and CLI against the installed chart
        run: bash hack/kubectl-ko-chart-test.sh verify

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kubectl-ko-chart-${{ matrix.ip-family }}
          path: kubectl-ko-chart-results/
          if-no-files-found: ignore

      - name: Check kube ovn pod restarts
        if: ${{ success() || (failure() && steps.install.conclusion == 'failure') }}
        run: make check-kube-ovn-pod-restarts
