name: Scheduled E2E

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "40 16 * * *"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  GO_VERSION: ''
  # renovate: datasource=github-releases depName=kind packageName=kubernetes-sigs/kind
  KIND_VERSION: v0.33.0
  # renovate: datasource=github-releases depName=helm packageName=helm/helm
  HELM_VERSION: v4.3.0

jobs:
  k8s-conformance-e2e:
    name: Kubernetes Conformance E2E
    runs-on: ubuntu-24.04
    # Leave time after the Ginkgo timeout for diagnostics and artifact uploads.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        branch:
          - master
          - release-1.16
          - release-1.15
          - release-1.14
          - release-1.13
          - release-1.12
          - release-1.11
        ip-family:
          - ipv4
          - ipv6
          - dual
        mode:
          - overlay
          - underlay
    steps:
      - uses: actions/checkout@v7

      - name: Remove DNS search domain
        run: |
          sudo sed -i '/^search/d' /etc/resolv.conf
          sudo systemctl restart docker

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION || '' }}
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Export Go full version
        run: echo "GO_FULL_VER=$(go env GOVERSION)" >> "$GITHUB_ENV"

      - name: Go cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-e2e-${{ env.GO_FULL_VER }}-x86-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-e2e-${{ env.GO_FULL_VER }}-x86-

      - name: Create branch directory
        run: mkdir -p test/e2e/k8s-network/branches/${{ matrix.branch }}

      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 1
          path: test/e2e/k8s-network/branches/${{ matrix.branch }}

      - name: Install kind
        uses: helm/kind-action@v1.15.1
        with:
          version: ${{ env.KIND_VERSION }}
          install_only: true

      - name: Install ginkgo
        working-directory: ${{ env.E2E_DIR }}
        run: go install -v -mod=mod github.com/onsi/ginkgo/v2/ginkgo

      - name: Create kind cluster
        working-directory: test/e2e/k8s-network/branches/${{ matrix.branch }}
        env:
          E2E_BRANCH: ${{ matrix.branch }}
        run: |
          sudo pip3 install jinjanator j2cli
          workers=1
          if [[ "$E2E_BRANCH" == "master" ]]; then
            workers=6
          elif [[ "$E2E_BRANCH" =~ ^release-([0-9]+)\.([0-9]+)$ ]] &&
            ((BASH_REMATCH[1] > 1 || (BASH_REMATCH[1] == 1 && BASH_REMATCH[2] >= 17))); then
            workers=6
          fi
          sudo env "PATH=$HOME/.local/bin:$PATH" n_worker="$workers" make kind-init-${{ matrix.ip-family }}
          sudo cp -r /root/.kube/ ~/.kube/
          sudo chown -R "$(id -un)." ~/.kube/
          if ((workers >= 6)); then
            zones=(zone-a zone-b zone-c)
            mapfile -t nodes < <(kubectl get nodes -o name | sort)
            for i in "${!nodes[@]}"; do
              kubectl label --overwrite "${nodes[$i]}" topology.kubernetes.io/zone="${zones[$((i % ${#zones[@]}))]}"
            done
          fi

      - name: Install Kube-OVN
        working-directory: test/e2e/k8s-network/branches/${{ matrix.branch }}
        run: |
          version=$(grep -E '^VERSION="v([0-9]+\.){2}[0-9]+"$' dist/images/install.sh | head -n1 | awk -F= '{print $2}' | tr -d '"')
          docker pull "kubeovn/kube-ovn:$version"
          VERSION="$version" make kind-install-${{ matrix.mode }}-${{ matrix.ip-family }}

      - name: Enable networking debug logs before E2E
        timeout-minutes: 5
        run: >-
          python3 "$GITHUB_WORKSPACE/hack/network_e2e_diagnostics.py" prepare
          "$GITHUB_WORKSPACE/network-e2e-diagnostics/preparation"

      - name: Run E2E
        env:
          E2E_BRANCH: ${{ matrix.branch }}
          E2E_IP_FAMILY: ${{ matrix.ip-family }}
          E2E_NETWORK_MODE: ${{ matrix.mode }}
          E2E_MAX_SECONDS: 4200
        run: >-
          python3 "$GITHUB_WORKSPACE/hack/network_e2e_diagnostics.py" run
          "$GITHUB_WORKSPACE/network-e2e-diagnostics"
          --suite k8s-conformance-e2e

      - name: Collect final network state
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: >-
          python3 hack/network_e2e_diagnostics.py snapshot
          network-e2e-diagnostics/post-job

      - name: Upload network diagnostics and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k8s-conformance-e2e-${{ matrix.branch }}-${{ matrix.ip-family }}-${{ matrix.mode }}-diagnostics
          path: network-e2e-diagnostics/
          retention-days: 7
          if-no-files-found: warn

      - name: Check kube ovn pod restarts
        run: |
          make check-kube-ovn-pod-restarts

  k8s-netpol-e2e:
    name: Kubernetes Network Policy E2E
    runs-on: ubuntu-24.04
    # Leave time after the Ginkgo timeout for diagnostics and artifact uploads.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        branch:
          - master
          - release-1.16
          - release-1.15
          - release-1.14
          - release-1.13
          - release-1.12
          - release-1.11
        ip-family:
          - ipv4
          - ipv6
          - dual
    steps:
      - uses: actions/checkout@v7

      - name: Remove DNS search domain
        run: |
          sudo sed -i '/^search/d' /etc/resolv.conf
          sudo systemctl restart docker

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION || '' }}
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Export Go full version
        run: echo "GO_FULL_VER=$(go env GOVERSION)" >> "$GITHUB_ENV"

      - name: Go cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-e2e-${{ env.GO_FULL_VER }}-x86-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-e2e-${{ env.GO_FULL_VER }}-x86-

      - name: Create branch directory
        run: mkdir -p test/e2e/k8s-network/branches/${{ matrix.branch }}

      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 1
          path: test/e2e/k8s-network/branches/${{ matrix.branch }}

      - name: Install kind
        uses: helm/kind-action@v1.15.1
        with:
          version: ${{ env.KIND_VERSION }}
          install_only: true

      - name: Install ginkgo
        working-directory: ${{ env.E2E_DIR }}
        run: go install -v -mod=mod github.com/onsi/ginkgo/v2/ginkgo

      - name: Create kind cluster
        working-directory: test/e2e/k8s-network/branches/${{ matrix.branch }}
        run: |
          sudo pip3 install jinjanator j2cli
          sudo env "PATH=$HOME/.local/bin:$PATH" make kind-init-${{ matrix.ip-family }}
          sudo cp -r /root/.kube/ ~/.kube/
          sudo chown -R "$(id -un)." ~/.kube/

      - name: Install Kube-OVN
        working-directory: test/e2e/k8s-network/branches/${{ matrix.branch }}
        run: |
          version=$(grep -E '^VERSION="v([0-9]+\.){2}[0-9]+"$' dist/images/install.sh | head -n1 | awk -F= '{print $2}' | tr -d '"')
          docker pull "kubeovn/kube-ovn:$version"
          VERSION="$version" make kind-install-${{ matrix.ip-family }}

      - name: Enable networking debug logs before E2E
        timeout-minutes: 5
        run: >-
          python3 "$GITHUB_WORKSPACE/hack/network_e2e_diagnostics.py" prepare
