        working-directory: ${{ env.E2E_DIR }}
        env:
          E2E_BRANCH: ${{ github.base_ref || github.ref_name }}
          E2E_IP_FAMILY: ${{ matrix.ip-family }}
          NP_ENFORCEMENT: ${{ matrix.np-enforcement }}
        run: >-
          python3 "$GITHUB_WORKSPACE/hack/network_e2e_diagnostics.py" run
          "$GITHUB_WORKSPACE/network-e2e-diagnostics"
          --suite k8s-netpol-e2e

      - name: Collect final network state
        if: always() && steps.install.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 3
        run: >-
          python3 hack/network_e2e_diagnostics.py snapshot
          network-e2e-diagnostics/post-job

      - name: Upload network diagnostics and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k8s-netpol-e2e-${{ matrix.ip-family }}-${{ matrix.np-enforcement }}-diagnostics
          path: network-e2e-diagnostics/
          retention-days: 7
          if-no-files-found: warn

      - name: Collect k8s events
        if: failure() && (steps.install.conclusion == 'failure' || steps.e2e.conclusion == 'failure')
        run: |
          kubectl get events -A -o yaml > k8s-netpol-e2e-${{ matrix.ip-family }}-${{ matrix.np-enforcement }}-events.yaml
          tar zcf k8s-netpol-e2e-${{ matrix.ip-family }}-${{ matrix.np-enforcement }}-events.tar.gz k8s-netpol-e2e-${{ matrix.ip-family }}-${{ matrix.np-enforcement }}-events.yaml

      - name: Upload k8s events
        uses: actions/upload-artifact@v7
        if: failure() && (steps.install.conclusion == 'failure' || steps.e2e.conclusion == 'failure')
        with:
          name: k8s-netpol-e2e-${{ matrix.ip-family }}-${{ matrix.np-enforcement }}-events
          path: k8s-netpol-e2e-${{ matrix.ip-family }}-${{ matrix.np-enforcement }}-events.tar.gz

      - name: Collect apiserver audit logs
        if: failure() && (steps.install.conclusion == 'failure' || steps.e2e.conclusion == 'failure')
        run: |
          docker cp kube-ovn-control-plane:/var/log/kubernetes/kube-apiserver-audit.log .
          tar zcf k8s-netpol-e2e-${{ matrix.ip-family }}-${{ matrix.np-enforcement }}-audit-log.tar.gz kube-apiserver-audit.log

      - name: Upload apiserver audit logs
        uses: actions/upload-artifact@v7
        if: failure() && (steps.install.conclusion == 'failure' || steps.e2e.conclusion == 'failure')
        with:
          name: k8s-netpol-e2e-${{ matrix.ip-family }}-${{ matrix.np-enforcement }}-audit-log
          path: k8s-netpol-e2e-${{ matrix.ip-family }}-${{ matrix.np-enforcement }}-audit-log.tar.gz


      - name: Check kube ovn pod restarts
        id: check-restarts
        if: ${{ success() || (failure() && (steps.install.conclusion == 'failure' || steps.e2e.conclusion == 'failure')) }}
        run: make check-kube-ovn-pod-restarts

      - name: kubectl ko logs
        if: failure() && (steps.install.conclusion == 'failure' || steps.e2e.conclusion == 'failure' || steps.check-restarts.conclusion == 'failure')
        run: |
          bash .github/scripts/collect-kubectl-ko-log.sh
          mv kubectl-ko-log.tar.gz k8s-netpol-e2e-${{ matrix.ip-family }}-${{ matrix.np-enforcement }}-ko-log.tar.gz

      - name: upload kubectl ko logs
        uses: actions/upload-artifact@v7
        if: failure() && (steps.install.conclusion == 'failure' || steps.e2e.conclusion == 'failure' || steps.check-restarts.conclusion == 'failure')
        with:
          name: k8s-netpol-e2e-${{ matrix.ip-family }}-${{ matrix.np-enforcement }}-ko-log
          path: k8s-netpol-e2e-${{ matrix.ip-family }}-${{ matrix.np-enforcement }}-ko-log.tar.gz

      - name: Check valgrind result
        if: env.DEBUG_WRAPPER == 'valgrind'
        run: |
          if [ "x$DEBUG_WRAPPER" != "xvalgrind" ]; then
            exit
          fi

          kubectl -n kube-system rollout restart ds ovs-ovn
          kubectl -n kube-system rollout status ds ovs-ovn
          sleep 10
          kubectl -n kube-system rollout restart deploy ovn-central
          kubectl -n kube-system rollout status deploy ovn-central
          while true; do
            if [ $(kubectl -n kube-system get pod -l app=ovs -o name | wc -l) -eq $(kubectl get node -o name | wc -l) ]; then
              break
            fi
            sleep 1
          done
          bash .github/scripts/collect-kubectl-ko-log.sh

          for daemon in ovsdb-nb ovsdb-sb ovn-northd ovn-controller ovsdb-server ovs-vswitchd; do
            echo "Checking if valgrind log file for $daemon exists..."
            find kubectl-ko-log -type f -name "$daemon.valgrind.log.[[:digit:]]*" -exec false {} + && exit 1
          done

          find kubectl-ko-log -type f -name '*.valgrind.log.*' | while read f; do
            if grep -qw 'definitely lost' "$f"; then
              echo "Memory leak detected in $(basename $f | awk -F. '{print $1}')."
              echo $f
              cat "$f"
              exit 1
            fi;
          done

  e2e-executor-result:
    name: x86 E2E Selected Result
    if: always() && github.event_name != 'pull_request'
    permissions: {}
    needs:
      - e2e-selection
      - e2e-control-validation
      - k8s-conformance-e2e
      - k8s-netpol-e2e
    runs-on: ubuntu-24.04
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      SELECTED_JOB_IDS: ${{ needs.e2e-selection.outputs.executionJobIds }}
    steps:
      - name: Verify every selected test Job succeeded
        run: |
          python3 - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          selectedJobIds = json.loads(os.environ["SELECTED_JOB_IDS"])
          requiredJobIds = ["e2e-selection", "e2e-control-validation"] + selectedJobIds
          incomplete = {
              jobId: needs.get(jobId, {}).get("result", "missing")
              for jobId in requiredJobIds
              if needs.get(jobId, {}).get("result") != "success"
          }
          if incomplete:
              raise SystemExit(f"required x86 E2E Jobs did not succeed: {incomplete}")
          print(f"Verified {len(requiredJobIds)} required x86 E2E Jobs.")
          PY

  notify-x86-e2e-gate:
    name: Notify x86 E2E gate of executor completion
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'github-actions[bot]' &&
      needs.e2e-executor-result.result != 'skipped'
    needs:
      - e2e-executor-result
    permissions:
      actions: write
      contents: write
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXECUTION_SHA }}
          persist-credentials: false

      - name: Dispatch the completed executor to the trusted gate
        env:
          PR_NUMBER: ${{ inputs.prNumber }}
          HEAD_SHA: ${{ inputs.headSHA }}
          BASE_SHA: ${{ inputs.baseSHA }}
          APPROVAL_GENERATION: ${{ inputs.approvalGeneration }}
          CATALOG_REVISION: ${{ inputs.catalogRevision }}
          REQUESTED_GROUPS: ${{ inputs.requestedGroups }}
          CONTROLLED_LABELS: ${{ inputs.controlledLabels }}
          FULL: ${{ inputs.full }}
          EXECUTOR_CONCLUSION: ${{ needs.e2e-executor-result.result }}
          EXECUTOR_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          executorRunAttempt=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$EXECUTOR_RUN_ID" \
            --jq '.run_attempt')
          python3 - "$PR_NUMBER" "$HEAD_SHA" "$BASE_SHA" "$APPROVAL_GENERATION" "$CATALOG_REVISION" "$REQUESTED_GROUPS" "$CONTROLLED_LABELS" "$FULL" "false" "false" "$EXECUTOR_RUN_ID" "$executorRunAttempt" "$EXECUTOR_CONCLUSION" <<'PY' > candidate-dispatch-inputs.json
          import json
          import sys
          from pathlib import Path

          fields = ['prNumber', 'headSHA', 'baseSHA', 'approvalGeneration', 'catalogRevision', 'requestedGroups', 'controlledLabels', 'full', 'recordIntent', 'baseRefresh', 'executorRunId', 'executorRunAttempt', 'executorConclusion']
          Path("candidate-dispatch-inputs.json").write_text(
              json.dumps(dict(zip(fields, sys.argv[1:], strict=True)))
          )
          PY
          python3 hack/e2e_pr_router.py dispatch \
            --pr-number "$PR_NUMBER" --head-sha "$HEAD_SHA" \
            --workflow x86-e2e-gate.yaml --inputs-file candidate-dispatch-inputs.json

  publish-pr-e2e-checks:
    name: Publish x86 E2E checks on the pull request
    if: github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      statuses: write
      contents: read
    needs:
      - e2e-selection
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
      HEAD_SHA: ${{ inputs.headSHA }}
      PR_NUMBER: ${{ inputs.prNumber }}
      SELECTED_JOB_IDS: ${{ needs.e2e-selection.outputs.executionJobIds }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXECUTION_SHA }}
          persist-credentials: false

      - name: Stream selected executor jobs onto the pull request HEAD
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - "$PR_NUMBER" "$HEAD_SHA" "$SELECTED_JOB_IDS" "$GITHUB_REPOSITORY" "$RUN_ID" <<'PY'
          import json
          import subprocess
          import sys
          import time
          from pathlib import Path

          sys.path.insert(0, "hack")
          import e2e_control as e2eControl
          import e2e_selector as e2eSelector

          prNumber = int(sys.argv[1])
          headSHA = sys.argv[2]
          selectedJobIds = json.loads(sys.argv[3])
          repository = sys.argv[4]
          runId = sys.argv[5]
          workflow = Path(".github/workflows/build-x86-image.yaml").read_text()
          blocks = e2eSelector.workflowJobBlocks(workflow)
          selectedTitles = [
              e2eControl.workflowJobTitle(blocks[jobId])
              for jobId in selectedJobIds
              if jobId in blocks
          ]
          infraTitles = e2eControl.visibleInfrastructureTitles(blocks)

          def load_jobs():
              pages = json.loads(
                  subprocess.check_output(
                      [
                          "gh",
                          "api",
                          "--paginate",
                          "--slurp",
                          f"repos/{repository}/actions/runs/{runId}/jobs?per_page=100",
                      ],
                      text=True,
                  )
              )
              jobs = []
              for page in pages:
                  jobs.extend(page.get("jobs") or [])
              return jobs

          published = {}
          for _ in range(720):
              jobs = load_jobs()
              for payload in e2eControl.prCheckRunsToPublish(
                  jobs,
                  selectedTitles,
                  headSHA,
                  prNumber,
                  detailsURL=f"https://github.com/{repository}/actions/runs/{runId}",
                  infraTitles=infraTitles,
              ):
                  statusPayload = e2eControl.prCommitStatusFromCheckRun(payload)
                  context = statusPayload["context"]
                  fingerprint = tuple(statusPayload.items())
                  if published.get(context) == fingerprint:
                      continue
                  subprocess.run(
                      [
                          "gh",
                          "api",
                          "--method",
                          "POST",
                          f"repos/{repository}/statuses/{headSHA}",
                          "--input",
                          "-",
                      ],
                      input=json.dumps(statusPayload),
                      text=True,
                      check=True,
                  )
                  published[context] = fingerprint
                  print(
                      f"{statusPayload['state']} {statusPayload['context']}",
                      flush=True,
                  )
              if e2eControl.selectedExecutorJobsAreTerminal(jobs, selectedTitles):
                  print(f"Mirrored {len(published)} pull request E2E checks.", flush=True)
                  break
              time.sleep(20)
          else:
              raise SystemExit("timed out while mirroring pull request E2E checks")
          PY

  push:
    name: Push Images
    needs:
      - e2e-executor-result
      - build-vpc-nat-gateway
    if: github.event_name == 'push' && needs.e2e-executor-result.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: jlumbroso/free-disk-space@v2.0.0
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: false
          large-packages: false
          tool-cache: false
          swap-storage: false

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXECUTION_SHA }}
          persist-credentials: false

      - name: Download kube-ovn image
        uses: actions/download-artifact@v8
        with:
          name: kube-ovn

      - name: Download kube-ovn-dpdk image
        uses: actions/download-artifact@v8
        if: github.event_name != 'pull_request'
        with:
          name: kube-ovn-dpdk

      - name: Download vpc-nat-gateway image
        uses: actions/download-artifact@v8
        with:
          name: vpc-nat-gateway

      - name: Load image
        run: |
          docker load --input kube-ovn.tar
          docker load --input vpc-nat-gateway.tar
          if [ '${{ github.event_name }}' != 'pull_request' ]; then
            docker load --input kube-ovn-dpdk.tar
          fi

      - name: Security Scan
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
        run: |
          sudo apt-get install wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy
          make scan

      - name: Push
        if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'release-')
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          COMMIT: ${{ github.sha }}
        run: |
          cat VERSION
          TAG=$(cat VERSION)
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          docker tag kubeovn/kube-ovn:$TAG kubeovn/kube-ovn-dev:$COMMIT-x86
          docker tag kubeovn/kube-ovn:$TAG kubeovn/kube-ovn:$TAG-x86
          docker tag kubeovn/kube-ovn:$TAG-debug kubeovn/kube-ovn:$TAG-debug-x86
          docker tag kubeovn/kube-ovn:$TAG-dpdk kubeovn/kube-ovn:$TAG-dpdk-x86
          docker tag kubeovn/vpc-nat-gateway:$TAG kubeovn/vpc-nat-gateway-dev:$COMMIT-x86
          docker tag kubeovn/vpc-nat-gateway:$TAG kubeovn/vpc-nat-gateway:$TAG-x86
          docker images
          docker push kubeovn/kube-ovn:$TAG-x86
          docker push kubeovn/kube-ovn:$TAG-amd64-legacy
          docker push kubeovn/kube-ovn-dev:$COMMIT-x86
          docker push kubeovn/kube-ovn:$TAG-debug-x86
          docker push kubeovn/kube-ovn:$TAG-dpdk-x86
          docker push kubeovn/vpc-nat-gateway:$TAG-x86
          docker push kubeovn/vpc-nat-gateway-dev:$COMMIT-x86
